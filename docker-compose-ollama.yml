services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    volumes:
      - ./ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=* # Permite conexiones desde el frontend
    runtime: nvidia
    networks:
      - ia-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # MEMORIA VECTORIAL (ES COMO REDIS)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - ia-network

    # MENSAJERÍA ENTRE MICROSERVICIOS
  nats:
    image: nats:latest
    container_name: nats-server
    ports:
      - "4222:4222" # Cliente NATS
      - "8222:8222" # Dashboard Monitoreo
    networks:
      - ia-network

  # ORQUESTADOR (NestJS + MCP)
  backend-gateway:
    build: ./backend-gateway
    container_name: nest-gateway
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      .env

    depends_on:
      - ollama
      - nats
    networks:
      - ia-network

  # INTERFAZ (React)
  frontend:
    build: ./frontend
    container_name: react-chat
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - ia-network

  mysql-db:
    image: mysql:8.0
    container_name: mysql-server
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=ia_chat_db
      - MYSQL_USER=ia_user
      - MYSQL_PASSWORD=ia_pass
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - ia-network
    # --- AÑADE ESTO ---
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uia_user", "-pia_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  ia-network:
    driver: bridge