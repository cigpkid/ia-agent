5. Frontend: App.jsx con Sockets
En React, necesitamos conectar el socket y escuchar los eventos.
javascript

import { io } from "socket.io-client";

// Fuera del componente para evitar reconexiones constantes
const socket = io("http://localhost:3000");

function App() {
  // ... tus estados ...

  useEffect(() => {
    // Escuchar el streaming de palabras
    socket.on('contentChunk', (data) => {
      setMessages(prev => {
        const lastMsg = prev[prev.length - 1];
        if (lastMsg && lastMsg.role === 'assistant') {
          // Actualizamos el último mensaje concatenando el chunk
          const newMessages = [...prev];
          newMessages[newMessages.length - 1].content += data.text;
          return newMessages;
        } else {
          // Si es la primera palabra, creamos el globo del asistente
          return [...prev, { role: 'assistant', content: data.text }];
        }
      });
    });

    socket.on('status', (data) => {
      if (data.state === 'executing_tool') {
        setStatus(`Ejecutando: ${data.tool}...`);
      } else {
        setStatus(data.state);
      }
    });

    return () => {
      socket.off('contentChunk');
      socket.off('status');
    };
  }, []);

  const sendMessage = () => {
    if (!input.trim()) return;
    
    // Mostramos el mensaje del usuario localmente
    setMessages(prev => [...prev, { role: 'user', content: input }]);
    
    socket.emit('sendMessage', { prompt: input, userId, sessionId });
    setInput('');
  };
  
  // ...
}

