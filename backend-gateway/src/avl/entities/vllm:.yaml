Si una herramienta requiere parámetros obligatorios que el usuario no proporcionó,
debes solicitar explícitamente esa información antes de llamar a la herramienta.
No debes rechazar la solicitud.

Resultado esperado

Usuario:

    Lista toda la información existente

Modelo:

    Para poder consultar la información necesito el identificador de la unidad o IMEI.
    ¿Podrías proporcionarlo?

✅ Natural
✅ Controlado
✅ Sin inventar datos
🟢 OPCIÓN 2 — Soportar “listado general” (más flexible)

Si sí tiene sentido listar todo, crea otra tool.
Nueva herramienta

{
  "name": "listar_unidades",
  "description": "Herramienta autorizada para listar todas las unidades o vehículos registrados en el sistema, junto con la información disponible de cada uno. No requiere identificador.",
  "parameters": {
    "type": "object",
    "properties": {}
  }
}

Regla mental del modelo

    “lista todo” → listar_unidades

    “unidad 987…” → extraer_datos_vehiculo

👉 Esto es gold standard en MCP.
🟡 OPCIÓN 3 — Parámetro opcional (solo si aplica)

Si tu backend puede manejarlo:

"required": []

y en la descripción:

Si no se proporciona identificador, devuelve información general disponible.

⚠️ Ojo: esto puede llevar a respuestas enormes o confusas.
🧠 Control fino: enséñale a decidir qué tool usar

En el system prompt:

Cuando el usuario solicite información:
- Si menciona un identificador (IMEI, unidad, número), usa extraer_datos_vehiculo.
- Si solicita un listado general o toda la información disponible sin identificador, usa listar_unidades.
- Si falta un parámetro requerido, solicita el dato al usuario antes de usar la herramienta.

Esto le quita TODA la ambigüedad.
🧪 Ejemplos de prompts que ya deberían funcionar

✔️ “Lista todas las unidades registradas”
✔️ “Muéstrame toda la información disponible del sistema”
✔️ “Dame el detalle de la unidad 987654321”
✔️ “Consulta el IMEI 987654321”
🧠 Regla de oro (muy importante)

👉 Nunca obligues a una tool a resolver dos intenciones distintas
(listar vs detalle).
Eso es lo que más rompe a los modelos chicos como 8B.

